<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacegames style frames</title>
    <style>
      html, body { margin: 0; background: #16131d; color: #f3ead8; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; }
      nav strong { margin-right: 8px; letter-spacing: 0.04em; }
      nav button { font: inherit; font-size: 14px; padding: 6px 12px; border: 2px solid #f3ead8; background: transparent; color: inherit; cursor: pointer; }
      nav button[aria-current="true"] { background: #f3ead8; color: #16131d; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
      canvas { display: block; width: min(100vw, calc((100vh - 110px) * 1.6)); height: auto; }
      figcaption { padding: 8px 16px 16px; font-size: 14px; line-height: 1.4; max-width: 1100px; opacity: 0.88; }
    </style>
  </head>
  <body>
    <nav id="nav"><strong>STYLE FRAMES</strong></nav>
    <figure>
      <canvas id="frame" width="1280" height="800"></canvas>
      <figcaption id="caption"></figcaption>
    </figure>
    <script type="module" src="/src/frames/main.ts"></script>
  </body>
</html>
